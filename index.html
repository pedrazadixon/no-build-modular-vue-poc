<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POC</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900|Material+Icons" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/quasar@2.18.6/dist/quasar.prod.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <div id="q-app">
      <div>index.html</div>
      <div>Counter: {{ counter }}</div>
      <div>
        <q-btn @click="decrement" label="Decrement"></q-btn>
        <q-btn @click="increment" label="Increment"></q-btn>
      </div>

      <div class="column">
        <iframe width="300" height="100" src="index_iframe1.html" frameborder="0"></iframe>
        <iframe width="300" height="400" src="index_iframe2.html" frameborder="0"></iframe>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.24/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quasar@2.18.6/dist/quasar.umd.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mobx@6.15.0/dist/mobx.umd.production.min.js"></script>
    <script src="js/storeAdapter.js"></script>
    <script src="js/globalStore.js"></script>

    <script>
      const { createApp, ref } = Vue;

      const app = createApp({
        setup() {
          const counter = ref(window.globalStore.count);

          mobx.reaction(
            () => window.globalStore.count,
            (newValue) => {
              counter.value = newValue;
            }
          );

          return {
            counter,
            increment: window.globalStore.increment,
            decrement: window.globalStore.decrement,
          };
        },
      });

      app.use(Quasar);
      app.mount("#q-app");
    </script>
  </body>
</html>
